[package]
name = "crypto-cli-tool"
version = "0.1.0"
edition = "2021"

[lib]
name = "crypto_cli_tool"
path = "src/lib.rs"

[[bin]]
name = "crypto-cli-tool"
path = "src/main.rs"

[[bin]]
name = "crypto"
path = "src/main.rs"

[dependencies]
# Cryptography libraries
ring = "0.17"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rsa = "0.9"
# Using p256 and hkdf for ECIES implementation instead of broken ecies crate
p256 = { version = "0.13", features = ["ecdh"] }
hkdf = "0.12"

# CLI and async
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
rpassword = "7.3"

# Compression
flate2 = "1.0"
zstd = "0.13"

# Utilities
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }
filetime = "0.2"
regex = "1.10"
base64 = "0.21"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.13"
